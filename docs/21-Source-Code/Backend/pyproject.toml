[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluanz"
version = "0.1.0"
description = "Revenue Readiness Intelligence Platform"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.15.21",
    "black>=26.5.1",
    "mypy>=1.22.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fluanz"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]